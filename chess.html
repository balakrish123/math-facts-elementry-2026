<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess Puzzles</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://unpkg.com/chessground@9.1.1/assets/chessground.base.css"
          onerror="this.href='lib/chessground/chessground.base.css'">
    <link rel="stylesheet" href="https://unpkg.com/chessground@9.1.1/assets/chessground.brown.css"
          onerror="this.href='lib/chessground/chessground.brown.css'">
    <link rel="stylesheet" href="https://unpkg.com/chessground@9.1.1/assets/chessground.cburnett.css"
          onerror="this.href='lib/chessground/chessground.cburnett.css'">
</head>
<body class="page-chess">
    <a href="index.html" class="back-btn">← Back to Subjects</a>

    <button class="sound-toggle" id="soundToggle">🔊</button>

    <div class="chess-layout">
        <div class="chess-left-panel">
            <h1>Chess Puzzles! ♟️</h1>

            <div class="difficulty-selector-left">
                <div class="difficulty-title">Difficulty</div>
                <div class="chess-difficulty-row">
                    <button class="difficulty-btn active" data-level="easy">Easy</button>
                    <button class="difficulty-btn" data-level="medium">Medium</button>
                    <button class="difficulty-btn" data-level="hard">Hard</button>
                </div>
            </div>

            <div class="score-board">
                <div class="score-item">
                    <div class="score-label">Correct</div>
                    <div class="score-value" id="correct">0</div>
                </div>
                <div class="score-item">
                    <div class="score-label">Wrong</div>
                    <div class="score-value" id="wrong">0</div>
                </div>
                <div class="score-item">
                    <div class="score-label">Streak</div>
                    <div class="score-value" id="streak">0</div>
                </div>
                <div class="score-item">
                    <div class="score-label">Total</div>
                    <div class="score-value" id="total">0</div>
                </div>
            </div>
        </div>

        <div class="chess-board-panel">
            <div class="chess-board-container" id="chessBoardContainer" style="display: none;">
                <div class="chess-board" id="chessBoard"></div>
            </div>
        </div>

        <div class="chess-controls-panel">
            <div class="timer-container">
                <button class="control-btn" id="startBtn">Start ▶️</button>
                <div class="timer" id="timer">120</div>
                <button class="control-btn pause hidden" id="pauseBtn">Pause ⏸️</button>
            </div>

            <div class="problem-area">
                <div class="problem" id="problem">Click Start to begin!</div>
                <div class="category-badge" id="categoryBadge" style="display: none;"></div>
                <a class="lichess-link" id="lichessLink" href="#" target="_blank" style="display: none;">
                    ♞ Try on Lichess
                </a>
                <div class="input-mode-toggle">
                    <button class="mode-btn active" id="modeDrag">Drag Pieces</button>
                    <button class="mode-btn" id="modeType">Type Move</button>
                </div>
                <div id="typeInputArea">
                    <input type="text" class="answer-input" id="answer" placeholder="e.g., Qh7#" disabled autocomplete="off" autocapitalize="off" spellcheck="false" style="display: none;">
                    <div class="keyboard-hint" id="keyboardHint" style="display: none;">Type your move in algebraic notation (e.g., Qh7, Rxf8, Nf6) and press Enter ↵</div>
                    <button class="submit-btn" id="submit" disabled style="display: none;">Check Move ♟️</button>
                </div>
                <div class="drag-hint" id="dragHint">Drag and drop a piece to make your move</div>
                <div class="feedback" id="feedback"></div>
            </div>

            <div class="chess-turn-banner" id="turnBanner">
                <div class="turn-color-box" id="turnColorBox"></div>
                <span class="turn-text" id="turnText">White to move</span>
            </div>
        </div>
    </div>

    <script src="common.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"
            onerror="var s=document.createElement('script');s.src='lib/chess/chess.min.js';document.head.appendChild(s);"></script>
    <script type="module">
        let Chessground;
        try {
            ({ Chessground } = await import('https://unpkg.com/chessground@9.1.1/dist/chessground.min.js'));
        } catch {
            ({ Chessground } = await import('./lib/chessground/chessground.min.js'));
        }

        checkLoginStatus();

        let currentPuzzle = null;
        let difficulty = 'easy';
        let usedPuzzles = new Set();
        let wrongCount = 0;
        let ground = null;
        let inputMode = 'drag';
        let waitingForNext = false;

        const puzzleCache = {};

        function loadPuzzles(level) {
            if (puzzleCache[level]) return Promise.resolve(puzzleCache[level]);

            const globalKey = 'puzzleData_' + level;
            if (window[globalKey]) {
                puzzleCache[level] = window[globalKey];
                return Promise.resolve(puzzleCache[level]);
            }

            document.getElementById('problem').textContent = 'Loading puzzles...';

            return new Promise((resolve) => {
                const script = document.createElement('script');
                script.src = `puzzles-${level}.js`;
                script.onload = () => {
                    puzzleCache[level] = window[globalKey];
                    resolve(puzzleCache[level]);
                };
                script.onerror = () => {
                    document.getElementById('problem').textContent = 'Failed to load puzzles!';
                    resolve(null);
                };
                document.head.appendChild(script);
            });
        }

        // Convert FEN to chessground piece map
        function fenToPieces(fen) {
            const pieces = new Map();
            const rows = fen.split(' ')[0].split('/');
            const roleMap = {
                'k': 'king', 'q': 'queen', 'r': 'rook', 'b': 'bishop', 'n': 'knight', 'p': 'pawn'
            };
            const files = 'abcdefgh';

            for (let r = 0; r < 8; r++) {
                let col = 0;
                for (let c = 0; c < rows[r].length; c++) {
                    const ch = rows[r][c];
                    if (ch >= '1' && ch <= '8') {
                        col += parseInt(ch);
                    } else {
                        const color = ch === ch.toUpperCase() ? 'white' : 'black';
                        const role = roleMap[ch.toLowerCase()];
                        const square = files[col] + (8 - r);
                        pieces.set(square, { role, color });
                        col++;
                    }
                }
            }
            return pieces;
        }

        // Get legal moves as a Map for chessground dests
        function getLegalDests(fen) {
            const chess = new Chess(fen);
            const dests = new Map();
            const moves = chess.moves({ verbose: true });
            for (const m of moves) {
                if (!dests.has(m.from)) dests.set(m.from, []);
                dests.get(m.from).push(m.to);
            }
            return dests;
        }

        function renderChessBoard(fen) {
            const boardEl = document.getElementById('chessBoard');
            const turnChar = fen.split(' ')[1] || 'w';
            const orientation = turnChar === 'w' ? 'white' : 'black';
            const turnColor = turnChar === 'w' ? 'white' : 'black';

            const config = {
                fen: fen,
                orientation: orientation,
                turnColor: turnColor,
                movable: {
                    free: false,
                    color: turnColor,
                    dests: getLegalDests(fen),
                    showDests: true,
                    events: {
                        after: onPieceDrop
                    }
                },
                draggable: {
                    enabled: true,
                    showGhost: true
                },
                selectable: {
                    enabled: true
                },
                highlight: {
                    lastMove: true,
                    check: true
                },
                animation: {
                    enabled: true,
                    duration: 200
                },
                premovable: {
                    enabled: false
                }
            };

            if (ground) {
                ground.set(config);
            } else {
                ground = Chessground(boardEl, config);
            }

            document.getElementById('chessBoardContainer').style.display = 'flex';

            const turnColorBox = document.getElementById('turnColorBox');
            const turnText = document.getElementById('turnText');
            const turnBanner = document.getElementById('turnBanner');
            if (turnChar === 'w') {
                turnColorBox.className = 'turn-color-box white-box';
                turnText.textContent = 'White to move';
                turnBanner.className = 'chess-turn-banner white-turn-banner';
            } else {
                turnColorBox.className = 'turn-color-box black-box';
                turnText.textContent = 'Black to move';
                turnBanner.className = 'chess-turn-banner black-turn-banner';
            }
        }

        function disableBoard() {
            if (ground) {
                ground.set({
                    movable: { color: undefined, dests: new Map() },
                    draggable: { enabled: false }
                });
            }
        }

        function onPieceDrop(orig, dest) {
            if (!gameStarted || !currentPuzzle || waitingForNext) return;

            const isCorrect = orig === currentPuzzle.uciFrom && dest === currentPuzzle.uciTo;
            const feedbackEl = document.getElementById('feedback');

            if (isCorrect) {
                waitingForNext = true;
                stopTimer();
                total++;
                correct++;
                streak++;
                feedbackEl.textContent = `🎉 Correct! ${currentPuzzle.answer} is right!`;
                feedbackEl.className = 'feedback correct celebrating';
                playCorrectSound();
                disableBoard();
                updateScoreboard();

                setTimeout(() => {
                    waitingForNext = false;
                    if (!isPaused && gameStarted) {
                        generateProblem();
                    }
                }, 1500);
            } else {
                feedbackEl.textContent = `Not quite. Try again!`;
                feedbackEl.className = 'feedback incorrect';
                playWrongSound();

                // Reset board to puzzle position and let them try again
                setTimeout(() => {
                    if (ground) {
                        const turnChar = currentPuzzle.fen.split(' ')[1] || 'w';
                        const turnColor = turnChar === 'w' ? 'white' : 'black';
                        ground.set({
                            fen: currentPuzzle.fen,
                            turnColor: turnColor,
                            movable: {
                                free: false,
                                color: turnColor,
                                dests: getLegalDests(currentPuzzle.fen),
                                showDests: true,
                                events: { after: onPieceDrop }
                            },
                            draggable: { enabled: true }
                        });
                    }
                }, 500);
            }
        }

        async function generateProblem() {
            const puzzles = await loadPuzzles(difficulty);
            if (!puzzles) return;

            if (usedPuzzles.size >= puzzles.length) {
                usedPuzzles.clear();
            }

            let puzzleIndex;
            do {
                puzzleIndex = Math.floor(Math.random() * puzzles.length);
            } while (usedPuzzles.has(puzzleIndex));

            usedPuzzles.add(puzzleIndex);
            currentPuzzle = puzzles[puzzleIndex];
            waitingForNext = false;

            document.getElementById('problem').textContent = currentPuzzle.question;

            const categoryBadge = document.getElementById('categoryBadge');
            categoryBadge.textContent = `♟️ Puzzle #${currentPuzzle.problemNumber} - ${currentPuzzle.category} (Rating: ${currentPuzzle.rating})`;
            categoryBadge.style.display = 'inline-block';

            const lichessLink = document.getElementById('lichessLink');
            if (currentPuzzle.lichessId) {
                lichessLink.href = `https://lichess.org/training/${currentPuzzle.lichessId}`;
                lichessLink.style.display = 'inline-block';
            } else {
                lichessLink.style.display = 'none';
            }

            renderChessBoard(currentPuzzle.fen);

            document.getElementById('answer').value = '';
            document.getElementById('feedback').textContent = '';

            if (inputMode === 'type') {
                document.getElementById('answer').focus();
            }

            if (gameStarted && !isPaused) {
                startTimer();
            }
        }

        function checkAnswer() {
            if (!gameStarted || !currentPuzzle || waitingForNext) return;

            const userAnswer = document.getElementById('answer').value.trim();
            const feedbackEl = document.getElementById('feedback');

            if (!userAnswer) {
                feedbackEl.textContent = 'Please enter a move!';
                feedbackEl.className = 'feedback incorrect';
                return;
            }

            const normalizedAnswer = userAnswer.replace(/[\s]/g, '');
            const isCorrect = currentPuzzle.acceptedAnswers.some(
                accepted => accepted.toLowerCase() === normalizedAnswer.toLowerCase()
            );

            if (isCorrect) {
                waitingForNext = true;
                stopTimer();
                total++;
                correct++;
                streak++;
                feedbackEl.textContent = `🎉 Correct! ${currentPuzzle.answer} is right!`;
                feedbackEl.className = 'feedback correct celebrating';
                playCorrectSound();
                disableBoard();
                if (ground) {
                    ground.set({ lastMove: [currentPuzzle.uciFrom, currentPuzzle.uciTo] });
                }
                updateScoreboard();

                setTimeout(() => {
                    waitingForNext = false;
                    if (!isPaused && gameStarted) {
                        generateProblem();
                    }
                }, 1500);
            } else {
                feedbackEl.textContent = `Not quite. Try again!`;
                feedbackEl.className = 'feedback incorrect';
                playWrongSound();
                document.getElementById('answer').value = '';
                document.getElementById('answer').focus();
            }
        }

        // Expose for common.js handleTimeout callback
        window.handleTimeout = function() {
            if (!gameStarted || isPaused || !currentPuzzle || waitingForNext) return;

            waitingForNext = true;
            total++;
            streak = 0;
            wrongCount++;
            document.getElementById('wrong').textContent = wrongCount;

            const feedbackEl = document.getElementById('feedback');
            feedbackEl.textContent = `⏱️ Time's up! The correct move was ${currentPuzzle.answer}`;
            feedbackEl.className = 'feedback incorrect';
            playWrongSound();

            disableBoard();
            if (ground) {
                ground.set({ lastMove: [currentPuzzle.uciFrom, currentPuzzle.uciTo] });
            }

            updateScoreboard();

            setTimeout(() => {
                waitingForNext = false;
                if (!isPaused && gameStarted) {
                    generateProblem();
                }
            }, 3000);
        };

        // Expose generateProblem for common.js start button
        window.generateProblem = generateProblem;

        function setInputMode(mode) {
            inputMode = mode;
            const answerInput = document.getElementById('answer');
            const submitBtn = document.getElementById('submit');
            const keyboardHint = document.getElementById('keyboardHint');
            const dragHint = document.getElementById('dragHint');

            document.getElementById('modeDrag').classList.toggle('active', mode === 'drag');
            document.getElementById('modeType').classList.toggle('active', mode === 'type');

            if (mode === 'type') {
                answerInput.style.display = '';
                submitBtn.style.display = '';
                keyboardHint.style.display = '';
                dragHint.style.display = 'none';
                if (gameStarted) {
                    answerInput.disabled = false;
                    submitBtn.disabled = false;
                }
            } else {
                answerInput.style.display = 'none';
                submitBtn.style.display = 'none';
                keyboardHint.style.display = 'none';
                dragHint.style.display = '';
            }
        }

        document.getElementById('submit').addEventListener('click', checkAnswer);

        document.getElementById('answer').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') checkAnswer();
        });

        document.getElementById('modeDrag').addEventListener('click', () => setInputMode('drag'));
        document.getElementById('modeType').addEventListener('click', () => setInputMode('type'));

        document.querySelectorAll('.difficulty-btn').forEach(btn => {
            btn.addEventListener('click', async function() {
                document.querySelectorAll('.difficulty-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                difficulty = this.dataset.level;
                usedPuzzles.clear();

                if (gameStarted && !isPaused) {
                    stopTimer();
                    await generateProblem();
                }
            });
        });

        setInputMode('drag');
    </script>
</body>
</html>
