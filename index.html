<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elementary Learning Hub</title>
    <style>
        :root {
            --primary-color: #667eea;
            --primary-dark: #764ba2;
            --success-color: #22c55e;
            --error-color: #ef4444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Comic Sans MS', cursive, sans-serif;
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--primary-dark) 100%);
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-container, .subjects-container {
            background: white;
            border-radius: 30px;
            padding: 50px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 90%;
            text-align: center;
        }

        .title {
            font-size: 2.8em;
            color: var(--primary-color);
            margin-bottom: 15px;
            font-weight: bold;
        }

        .subtitle {
            font-size: 1.2em;
            color: #666;
            margin-bottom: 35px;
        }

        /* Login Form */
        .login-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .input-group {
            text-align: left;
        }

        .label {
            display: block;
            font-size: 1.1em;
            font-weight: bold;
            color: #333;
            margin-bottom: 8px;
        }

        .input {
            width: 100%;
            padding: 15px;
            font-size: 1.1em;
            border: 3px solid var(--primary-color);
            border-radius: 15px;
            font-family: inherit;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        .input:focus {
            outline: none;
            border-color: var(--primary-dark);
            box-shadow: 0 0 20px rgba(102, 126, 234, 0.4);
            transform: scale(1.02);
        }

        .btn {
            padding: 18px 40px;
            font-size: 1.5em;
            background: linear-gradient(135deg, var(--success-color) 0%, #16a34a 100%);
            color: white;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            margin-top: 10px;
            box-shadow: 0 6px 20px rgba(34, 197, 94, 0.3);
        }

        .btn:hover {
            transform: scale(1.08) translateY(-2px);
            box-shadow: 0 10px 30px rgba(34, 197, 94, 0.5);
        }

        .btn:active {
            transform: scale(0.95);
        }

        .error {
            color: var(--error-color);
            font-weight: bold;
            margin-top: 15px;
            font-size: 1.1em;
        }

        .hint {
            margin-top: 20px;
            padding: 15px;
            background: #f0f4ff;
            border-radius: 10px;
            font-size: 0.85em;
            color: #666;
            border-left: 4px solid var(--primary-color);
        }

        .hint strong {
            color: var(--primary-color);
        }

        /* Subject Selection */
        .subjects-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-top: 30px;
        }

        .subject-card {
            background: linear-gradient(135deg, #f0f4ff 0%, #fef3ff 100%);
            border: 3px solid var(--primary-color);
            border-radius: 20px;
            padding: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .subject-card:hover {
            transform: translateY(-5px) scale(1.03);
            box-shadow: 0 15px 40px rgba(102, 126, 234, 0.3);
            background: linear-gradient(135deg, var(--success-color) 0%, #16a34a 100%);
            color: white;
            border-color: #16a34a;
        }

        .subject-emoji {
            font-size: 4em;
        }

        .subject-name {
            font-size: 1.5em;
            font-weight: bold;
        }

        .hidden {
            display: none !important;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        @media (max-width: 600px) {
            .subjects-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <!-- Login Screen -->
    <div class="login-container" id="loginScreen">
        <div class="title">🎓 Master Your Mind</div>
        <div class="subtitle">Login to start learning!</div>
        <form class="login-form" id="loginForm">
            <div class="input-group">
                <label class="label" for="username">Username</label>
                <input type="text" class="input" id="username" placeholder="Enter your username" required autofocus>
            </div>
            <div class="input-group">
                <label class="label" for="password">Password</label>
                <input type="password" class="input" id="password" placeholder="Enter your password" required>
            </div>
            <button type="submit" class="btn">Let's Go! 🚀</button>
            <div class="error hidden" id="error"></div>
        </form>
        <div class="hint">
            <strong>Demo Accounts:</strong><br>
            student / math123<br>
            teacher / teach456<br>
            admin / admin789
        </div>
    </div>

    <!-- Subject Selection Screen -->
    <div class="subjects-container hidden" id="subjectsScreen">
        <div class="title">📚 Choose Your Subject</div>
        <div class="subtitle">Pick a subject to practice!</div>

        <div class="subjects-grid">
            <a href="math.html" class="subject-card">
                <div class="subject-emoji">🔢</div>
                <div class="subject-name">Math Facts</div>
            </a>

            <a href="spelling.html" class="subject-card">
                <div class="subject-emoji">📝</div>
                <div class="subject-name">Spelling</div>
            </a>

            <a href="vocabulary.html" class="subject-card">
                <div class="subject-emoji">📖</div>
                <div class="subject-name">Vocabulary</div>
            </a>

            <a href="geography.html" class="subject-card">
                <div class="subject-emoji">🌍</div>
                <div class="subject-name">Geography</div>
            </a>

            <a href="science.html" class="subject-card">
                <div class="subject-emoji">🔬</div>
                <div class="subject-name">Science</div>
            </a>

            <a href="index.html" class="subject-card" style="grid-column: span 2;">
                <div class="subject-emoji">🏠</div>
                <div class="subject-name">Logout</div>
            </a>
        </div>
    </div>

    <script>
        // Login credentials
        const validCredentials = {
            'student': 'math123',
            'teacher': 'teach456',
            'admin': 'admin789'
        };

        // Handle login
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorEl = document.getElementById('error');

            if (validCredentials[username] && validCredentials[username] === password) {
                // Store login in sessionStorage
                sessionStorage.setItem('loggedIn', 'true');
                sessionStorage.setItem('username', username);

                // Show subjects screen
                document.getElementById('loginScreen').classList.add('hidden');
                document.getElementById('subjectsScreen').classList.remove('hidden');
            } else {
                errorEl.textContent = '❌ Invalid username or password!';
                errorEl.classList.remove('hidden');
                document.getElementById('password').value = '';

                const loginContainer = document.querySelector('.login-container');
                loginContainer.style.animation = 'shake 0.5s';
                setTimeout(() => {
                    loginContainer.style.animation = '';
                }, 500);
            }
        });

        // Check if already logged in
        if (sessionStorage.getItem('loggedIn') === 'true') {
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('subjectsScreen').classList.remove('hidden');
        }
    </script>
</body>
</html>
