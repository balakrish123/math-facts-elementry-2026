
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spelling Practice</title>
    <link rel="stylesheet" href="styles.css">
    <!-- All styles now in styles.css -->
</head>
<body class="page-spelling">
    <a href="index.html" class="back-btn">← Back to Subjects</a>

    <button class="sound-toggle" id="soundToggle">🔊</button>

    <div class="left-panel" id="leftPanel">
        <div class="difficulty-selector-left" style="margin-bottom: 20px;">
            <div class="difficulty-title">📚 Mode</div>
            <button class="difficulty-btn active" data-mode="words">📖 Words</button>
            <button class="difficulty-btn" data-mode="states">🗺️ US States</button>
            <button class="difficulty-btn" data-mode="capitals">🏛️ US Capitals</button>
        </div>

        <div class="difficulty-selector-left">
            <div class="difficulty-title">🎯 Difficulty</div>
            <button class="difficulty-btn active" data-level="easy">Easy</button>
            <button class="difficulty-btn" data-level="medium">Medium</button>
            <button class="difficulty-btn" data-level="hard">Hard</button>
        </div>
    </div>

    <div class="right-panel" id="rightPanel">
        <div class="score-board">
            <div class="score-item">
                <div class="score-label">Correct</div>
                <div class="score-value" id="correct">0</div>
            </div>
            <div class="score-item">
                <div class="score-label">Streak</div>
                <div class="score-value" id="streak">0</div>
            </div>
            <div class="score-item">
                <div class="score-label">Total</div>
                <div class="score-value" id="total">0</div>
            </div>
        </div>
        <div class="rewards-bank">
            <div class="bank-title">🏦 My Rewards Bank 🏦</div>
            <div class="rewards-container" id="rewards"></div>
        </div>
    </div>

    <div class="container" id="mainContainer">
        <h1>Spelling Practice!</h1>

        <div class="timer-container">
            <button class="control-btn" id="startBtn">Start ▶️</button>
            <div class="timer" id="timer">45</div>
            <button class="control-btn pause hidden" id="pauseBtn">Pause ⏸️</button>
        </div>

        <div class="problem-area">
            <div class="problem" id="problem">Click Start to begin!</div>
            <button class="pronounce-btn" id="pronounceBtn" disabled>🔊 Play Word</button>
            <div class="word-definition" id="wordDefinition" style="display: none;">
                <div class="definition-label">📖 Definition:</div>
                <div class="definition-text" id="definitionText"></div>
            </div>
            <input type="text" class="answer-input" id="answer" placeholder="Type the word..." disabled>
            <div class="keyboard-hint">Press Enter ↵ to submit</div>
            <button class="submit-btn" id="submit" disabled>Check Spelling</button>
            <div class="feedback" id="feedback"></div>
        </div>
    </div>

    <script src="common.js"></script>
    <script src="spelling-words.js"></script>
    <script src="states-capitals-data.js"></script>
    <script>
        // Check login status
        checkLoginStatus();

        // Spelling-specific variables
        let currentAnswer = '';
        let difficulty = 'easy';
        let currentWord = '';
        let isRetryAttempt = false;
        let mode = 'words'; // 'words', 'states', or 'capitals'
        let usedStates = new Set();

        // ========================================
        // MERRIAM-WEBSTER API CONFIGURATION
        // ========================================
        // Using School Dictionary 4th Edition (sd4) - Perfect for elementary students!
        // Sign up at https://dictionaryapi.com/register/index
        // Get your FREE School Dictionary API key (sd4 or sd2)
        // API key is obfuscated using multi-layer encoding (not cryptographically secure)

        // Decode function - DO NOT MODIFY
        function _dk(s) {
            const k = 'eduLearn2026';
            let r = '';
            for (let i = 0; i < s.length; i++) {
                r += String.fromCharCode(s.charCodeAt(i) ^ k.charCodeAt(i % k.length));
            }
            return r;
        }

        // Encoded API key (XOR + base64 obfuscation)
        const _encoded = 'VQJNLlxYEFkfVFZXA0lBKVdQX1ZWAgobAABEelxVQl0EUwoH';
        const MERRIAM_WEBSTER_API_KEY = _dk(atob(_encoded));

        // Text-to-speech function with Merriam-Webster API support
        async function speakWord(word) {
            // Try Merriam-Webster API first (if API key is configured)
            if (MERRIAM_WEBSTER_API_KEY && MERRIAM_WEBSTER_API_KEY !== 'YOUR_API_KEY_HERE') {
                const audioPlayed = await playMerriamWebsterAudio(word);
                if (audioPlayed) {
                    return; // Successfully played M-W audio
                }
            }

            // Fallback to browser's built-in text-to-speech
            const utterance = new SpeechSynthesisUtterance(word);
            utterance.rate = 0.8; // Slower for kids
            utterance.pitch = 1.0;
            utterance.volume = 1.0;

            // Try to use US English voice if available
            const voices = speechSynthesis.getVoices();
            const usVoice = voices.find(v => v.lang === 'en-US' && v.name.includes('US'));
            if (usVoice) {
                utterance.voice = usVoice;
            }

            speechSynthesis.speak(utterance);
        }

        // Fetch and play audio from Merriam-Webster API
        async function playMerriamWebsterAudio(word) {
            try {
                // Use sd4 (School Dictionary 4th Edition) endpoint
                const url = `https://www.dictionaryapi.com/api/v3/references/sd4/json/${word.toLowerCase()}?key=${MERRIAM_WEBSTER_API_KEY}`;
                const response = await fetch(url);

                if (!response.ok) {
                    return false; // API call failed
                }

                const data = await response.json();

                // Check if we got valid dictionary data
                if (!Array.isArray(data) || data.length === 0 || typeof data[0] === 'string') {
                    return false; // Word not found or suggestions returned
                }

                // Get entry data
                const entry = data[0];

                // Extract and display definition (if available)
                if (entry.shortdef && entry.shortdef.length > 0) {
                    const definition = entry.shortdef[0];
                    displayDefinition(definition);
                }

                // Find pronunciation audio file
                if (entry.hwi && entry.hwi.prs && entry.hwi.prs.length > 0) {
                    const pronunciation = entry.hwi.prs[0];
                    if (pronunciation.sound && pronunciation.sound.audio) {
                        const audioFile = pronunciation.sound.audio;

                        // Build audio URL based on M-W's subdirectory structure
                        let subdirectory = audioFile.charAt(0);
                        if (audioFile.startsWith('bix')) {
                            subdirectory = 'bix';
                        } else if (audioFile.startsWith('gg')) {
                            subdirectory = 'gg';
                        } else if (!isNaN(audioFile.charAt(0))) {
                            subdirectory = 'number';
                        }

                        const audioUrl = `https://media.merriam-webster.com/audio/prons/en/us/mp3/${subdirectory}/${audioFile}.mp3`;

                        // Play the audio
                        const audio = new Audio(audioUrl);
                        console.log('🎵 Playing Merriam-Webster audio for:', word);

                        await audio.play();
                        return true; // Successfully played
                    }
                }

                return false; // No audio found
            } catch (error) {
                console.log('M-W API unavailable, using fallback:', error.message);
                return false; // Error occurred, use fallback
            }
        }

        // Display word definition
        function displayDefinition(definition) {
            const definitionEl = document.getElementById('wordDefinition');
            const definitionText = document.getElementById('definitionText');

            if (definition) {
                definitionText.textContent = definition;
                definitionEl.style.display = 'block';
            }
        }

        // Hide definition
        function hideDefinition() {
            const definitionEl = document.getElementById('wordDefinition');
            definitionEl.style.display = 'none';
        }

        // Generate a spelling problem
        function generateProblem() {
            if (mode === 'words') {
                generateWordSpelling();
            } else if (mode === 'states') {
                generateStateSpelling();
            } else if (mode === 'capitals') {
                generateCapitalSpelling();
            }
        }

        // Generate word spelling problem
        function generateWordSpelling() {
            const wordList = spellingWords[difficulty];
            currentWord = wordList[Math.floor(Math.random() * wordList.length)];
            currentAnswer = currentWord.toLowerCase();
            isRetryAttempt = false;

            const problemEl = document.getElementById('problem');
            problemEl.textContent = '🔊 Listen and spell the word...';

            document.getElementById('answer').value = '';
            document.getElementById('feedback').textContent = '';
            hideDefinition();
            document.getElementById('answer').focus();

            speakWord(currentWord);
            document.getElementById('pronounceBtn').disabled = false;

            if (gameStarted && !isPaused && pendingPieceIndex === null) {
                startTimer();
            }
        }

        // Generate US state spelling
        function generateStateSpelling() {
            const statesList = statesCapitals[difficulty] || statesCapitals.all;

            if (usedStates.size >= statesList.length) {
                usedStates.clear();
            }

            let stateIndex;
            do {
                stateIndex = Math.floor(Math.random() * statesList.length);
            } while (usedStates.has(stateIndex));

            usedStates.add(stateIndex);
            const stateData = statesList[stateIndex];

            currentWord = stateData.state;
            currentAnswer = stateData.state.toLowerCase();
            isRetryAttempt = false;

            const problemEl = document.getElementById('problem');
            problemEl.textContent = `🗺️ Spell this US State... (Capital: ${stateData.capital})`;

            document.getElementById('answer').value = '';
            document.getElementById('feedback').textContent = '';
            hideDefinition();
            document.getElementById('answer').focus();

            speakWord(currentWord);
            document.getElementById('pronounceBtn').disabled = false;

            if (gameStarted && !isPaused && pendingPieceIndex === null) {
                startTimer();
            }
        }

        // Generate US capital spelling
        function generateCapitalSpelling() {
            const statesList = statesCapitals[difficulty] || statesCapitals.all;

            if (usedStates.size >= statesList.length) {
                usedStates.clear();
            }

            let stateIndex;
            do {
                stateIndex = Math.floor(Math.random() * statesList.length);
            } while (usedStates.has(stateIndex));

            usedStates.add(stateIndex);
            const stateData = statesList[stateIndex];

            currentWord = stateData.capital;
            currentAnswer = stateData.capital.toLowerCase();
            isRetryAttempt = false;

            const problemEl = document.getElementById('problem');
            problemEl.textContent = `🏛️ Spell the capital of ${stateData.state}...`;

            document.getElementById('answer').value = '';
            document.getElementById('feedback').textContent = '';
            hideDefinition();
            document.getElementById('answer').focus();

            speakWord(currentWord);
            document.getElementById('pronounceBtn').disabled = false;

            if (gameStarted && !isPaused && pendingPieceIndex === null) {
                startTimer();
            }
        }

        // Check spelling
        function checkAnswer() {
            if (!gameStarted) return;

            const userAnswer = document.getElementById('answer').value.trim().toLowerCase();
            const feedbackEl = document.getElementById('feedback');

            if (!userAnswer) {
                feedbackEl.textContent = 'Please type a word!';
                feedbackEl.className = 'feedback incorrect';
                return;
            }

            // Stop the timer
            stopTimer();

            if (userAnswer === currentAnswer) {
                // Correct answer
                total++;
                correct++;
                streak++;

                if (isRetryAttempt) {
                    feedbackEl.textContent = `🎉 Great! You got it right on your second try!`;
                } else {
                    feedbackEl.textContent = `🎉 Perfect! "${currentWord}" is spelled right!`;
                }
                feedbackEl.className = 'feedback correct celebrating';

                // Play success sound
                playCorrectSound();

                // Add reward using common utility function
                addRewardSimple(window.innerWidth / 2, window.innerHeight / 2);
                updateScoreboard();

                setTimeout(() => {
                    if (!isPaused) {
                        generateProblem();
                    }
                }, 1500);
            } else {
                // Wrong answer
                if (!isRetryAttempt) {
                    // First mistake - give them another try
                    isRetryAttempt = true;
                    feedbackEl.textContent = `❌ Try again! Listen carefully... (Correct: "${currentWord}")`;
                    feedbackEl.className = 'feedback incorrect';

                    // Play wrong sound
                    playWrongSound();

                    // Clear the input and let them try again
                    document.getElementById('answer').value = '';

                    // Speak the correct word again
                    setTimeout(() => speakWord(currentWord), 1000);

                    // Restart timer for retry
                    setTimeout(() => {
                        if (!isPaused && gameStarted) {
                            startTimer();
                        }
                    }, 1500);
                } else {
                    // Second mistake - count it and move on
                    total++;
                    streak = 0;
                    feedbackEl.textContent = `❌ The correct spelling was "${currentWord}". Moving to next word...`;
                    feedbackEl.className = 'feedback incorrect';

                    // Play wrong sound
                    playWrongSound();

                    // Speak the word one more time
                    setTimeout(() => speakWord(currentWord), 800);

                    updateScoreboard();

                    setTimeout(() => {
                        if (!isPaused) {
                            generateProblem();
                        }
                    }, 3000);
                }
            }
        }

        // Handle timeout
        function handleTimeout() {
            if (!gameStarted || isPaused) return;

            const feedbackEl = document.getElementById('feedback');

            if (!isRetryAttempt) {
                // First timeout - give them another try
                isRetryAttempt = true;
                feedbackEl.textContent = `⏱️ Time's up! Try again! The word is "${currentWord}"`;
                feedbackEl.className = 'feedback incorrect';
                playWrongSound();

                // Clear input and speak word
                document.getElementById('answer').value = '';
                speakWord(currentWord);

                // Restart timer for retry
                setTimeout(() => {
                    if (!isPaused && gameStarted) {
                        startTimer();
                    }
                }, 2000);
            } else {
                // Second timeout - count it and move on
                total++;
                streak = 0;

                feedbackEl.textContent = `⏱️ Time's up again! The word was "${currentWord}". Moving on...`;
                feedbackEl.className = 'feedback incorrect';
                playWrongSound();

                // Speak the word
                speakWord(currentWord);

                updateScoreboard();

                setTimeout(() => {
                    if (!isPaused) {
                        generateProblem();
                    }
                }, 3000);
            }
        }

        // Setup spelling-specific listeners
        document.addEventListener('DOMContentLoaded', function() {
            // Submit button
            document.getElementById('submit').addEventListener('click', checkAnswer);

            // Enter key to submit
            document.getElementById('answer').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    checkAnswer();
                }
            });

            // Pronounce button
            document.getElementById('pronounceBtn').addEventListener('click', function() {
                if (currentWord) {
                    speakWord(currentWord);
                }
            });

            // Mode buttons
            document.querySelectorAll('[data-mode]').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('[data-mode]').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    mode = this.dataset.mode;
                    usedStates.clear();

                    if (gameStarted && !isPaused) {
                        stopTimer();
                        generateProblem();
                    }
                });
            });

            // Difficulty buttons
            document.querySelectorAll('[data-level]').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('[data-level]').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    difficulty = this.dataset.level;
                    usedStates.clear();

                    if (gameStarted && !isPaused) {
                        stopTimer();
                        generateProblem();
                    }
                });
            });
        });
    </script>
</body>
</html>
